name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate folder android (jika belum ada)
        run: |
          if [ ! -d android ]; then
            cp -r lib /tmp/lib_backup
            cp pubspec.yaml /tmp/pubspec_backup.yaml
            flutter create . --platforms=android --project-name bakso_mantap --org com.artholic
            rm -rf lib test
            cp -r /tmp/lib_backup lib
            cp /tmp/pubspec_backup.yaml pubspec.yaml
          fi
          sed -i 's/android:label="[^"]*"/android:label="Bakso TITATI"/' android/app/src/main/AndroidManifest.xml

      - name: Izin INTERNET untuk build release
        run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Izin Bluetooth untuk cetak struk
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in BLUETOOTH BLUETOOTH_ADMIN BLUETOOTH_CONNECT BLUETOOTH_SCAN; do
            if ! grep -q "android.permission.$P\"" $M; then
              EXTRA=''
              case $P in
                BLUETOOTH|BLUETOOTH_ADMIN) EXTRA=' android:maxSdkVersion="30"';;
              esac
              sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\"$EXTRA/>\n    <application#" $M
            fi
          done

      - run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: bakso-mantap-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Release APK (saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
